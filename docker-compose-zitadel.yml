# =============================================================================
# Mifos X Web App (React) + Apache Fineract + MariaDB
# With Zitadel OIDC Authentication
# =============================================================================
#
# Usage:
#   docker compose -f docker-compose-zitadel.yml up -d
#
# Prerequisites:
#   Copy .env.docker.sample to .env.docker and fill in secrets
#
# Access:
#   - Web App:  http://localhost:10706
#   - Fineract: https://localhost:3000
# =============================================================================

networks:
  sandbox:
    driver: bridge

volumes:
  mysql_data:
  fineract_data:

services:
  # ---------------------------------------------------------------------------
  # Mifos X React Web App (Frontend)
  # ---------------------------------------------------------------------------
  web-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_DATE: '${BUILD_DATE:-}'
        VCS_REF: '${VCS_REF:-}'
        VERSION: '${VERSION:-dev}'
    image: mifos/web-app-react:dev
    restart: unless-stopped
    depends_on:
      fineract-server:
        condition: service_healthy
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sandbox
    environment:
      - TZ=UTC
      - FINERACT_API_URL=
      - FINERACT_API_PROVIDER=/fineract-provider
      - FINERACT_API_VERSION=/api
      - FINERACT_PLATFORM_TENANT_IDENTIFIER=default
      - MIFOS_DEFAULT_LANGUAGE=en-US
      - MIFOS_SUPPORTED_LANGUAGES=cs-CS,de-DE,en-US,es-MX,fr-FR,it-IT,ko-KO,li-LI,lv-LV,ne-NE,pt-PT,sw-SW
      - MIFOS_PRELOAD_CLIENTS=true
      - MIFOS_DEFAULT_CHAR_DELIMITER=,
      - MIFOS_OAUTH_SERVER_ENABLED=false
      - FINERACT_PLUGIN_OIDC_ENABLED=false
      - FINERACT_PLUGIN_OIDC_BASE_URL=https://mifos-security-plugin-oawujj.us1.zitadel.cloud/
      - FINERACT_PLUGIN_OIDC_CLIENT_ID=331500467848847765
      - FINERACT_PLUGIN_OIDC_API_URL=https://oidc.mifos.community/fineract-provider/
      - FINERACT_PLUGIN_OIDC_FRONTEND_URL=https://oidc.mifos.community/
    ports:
      - 10706:80
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ---------------------------------------------------------------------------
  # MariaDB Database
  # ---------------------------------------------------------------------------
  fineractmysql:
    image: mariadb:11.4
    volumes:
      - ./fineract-db/server_collation.cnf:/etc/mysql/conf.d/server_collation.cnf:ro
      - ./fineract-db/docker:/docker-entrypoint-initdb.d:Z,ro
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - sandbox
    env_file:
      - .env.docker
    environment:
      - TZ=UTC
    healthcheck:
      test:
        [
          'CMD',
          'healthcheck.sh',
          '--su-mysql',
          '--connect',
          '--innodb_initialized',
        ]
      timeout: 10s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
  #    ports:
  #      - "3306:3306"

  # ---------------------------------------------------------------------------
  # Apache Fineract Backend Server
  # ---------------------------------------------------------------------------
  fineract-server:
    image: openmf/fineract:develop
    restart: unless-stopped
    depends_on:
      fineractmysql:
        condition: service_healthy
    volumes:
      - fineract_data:/.fineract
    healthcheck:
      test: ['CMD', 'sh', '-c', 'nc -z localhost 8443']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    stop_grace_period: 30s
    ports:
      - 3000:8443
    networks:
      - sandbox
    env_file:
      - .env.docker
    environment:
      - TZ=UTC
      # -- Node Configuration --
      - FINERACT_NODE_ID=1
      # -- Database Connection Pool (HikariCP) --
      - FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME=org.mariadb.jdbc.Driver
      - FINERACT_HIKARI_JDBC_URL=jdbc:mariadb://fineractmysql:3306/fineract_tenants
      - FINERACT_HIKARI_USERNAME=root
      # FINERACT_HIKARI_PASSWORD loaded from .env.docker
      - FINERACT_HIKARI_MINIMUM_IDLE=3
      - FINERACT_HIKARI_MAXIMUM_POOL_SIZE=10
      - FINERACT_HIKARI_IDLE_TIMEOUT=60000
      - FINERACT_HIKARI_CONNECTION_TIMEOUT=20000
      - FINERACT_HIKARI_TEST_QUERY=SELECT 1
      - FINERACT_HIKARI_AUTO_COMMIT=true
      - FINERACT_HIKARI_DS_PROPERTIES_CACHE_PREP_STMTS=true
      - FINERACT_HIKARI_DS_PROPERTIES_PREP_STMT_CACHE_SIZE=250
      - FINERACT_HIKARI_DS_PROPERTIES_PREP_STMT_CACHE_SQL_LIMIT=2048
      - FINERACT_HIKARI_DS_PROPERTIES_USE_SERVER_PREP_STMTS=true
      - FINERACT_HIKARI_DS_PROPERTIES_USE_LOCAL_SESSION_STATE=true
      - FINERACT_HIKARI_DS_PROPERTIES_REWRITE_BATCHED_STATEMENTS=true
      - FINERACT_HIKARI_DS_PROPERTIES_CACHE_RESULT_SET_METADATA=true
      - FINERACT_HIKARI_DS_PROPERTIES_CACHE_SERVER_CONFIGURATION=true
      - FINERACT_HIKARI_DS_PROPERTIES_ELIDE_SET_AUTO_COMMITS=true
      - FINERACT_HIKARI_DS_PROPERTIES_MAINTAIN_TIME_STATS=false
      - FINERACT_HIKARI_DS_PROPERTIES_LOG_SLOW_QUERIES=true
      - FINERACT_HIKARI_DS_PROPERTIES_DUMP_QUERIES_IN_EXCEPTION=true
      # -- Default Tenant Database --
      - FINERACT_DEFAULT_TENANTDB_HOSTNAME=fineractmysql
      - FINERACT_DEFAULT_TENANTDB_PORT=3306
      - FINERACT_DEFAULT_TENANTDB_UID=root
      # FINERACT_DEFAULT_TENANTDB_PWD loaded from .env.docker
      - FINERACT_DEFAULT_TENANTDB_CONN_PARAMS=useUnicode=true&characterEncoding=utf8
      - FINERACT_DEFAULT_TENANTDB_TIMEZONE=UTC
      - FINERACT_DEFAULT_TENANTDB_IDENTIFIER=default
      - FINERACT_DEFAULT_TENANTDB_NAME=fineract_default
      - FINERACT_DEFAULT_TENANTDB_DESCRIPTION=Default Demo Tenant
      - JAVA_TOOL_OPTIONS=-Xmx1G
      # -- Security --
      - FINERACT_SECURITY_BASICAUTH_ENABLED=true
      - FINERACT_SECURITY_OAUTH_ENABLED=false
      - FINERACT_SECURITY_2FA_ENABLED=false
      - FINERACT_SECURITY_HSTS_ENABLED=false
      # -- Zitadel OIDC --
      - FINERACT_PLUGIN_OIDC_FRONTEND_URL=https://oidc.mifos.community
      - FINERACT_PLUGIN_OIDC_PROJECT_ID=331498656278545085
      - FINERACT_PLUGIN_OIDC_PROJECT_GRANT_ID=331501470320984765
      - FINERACT_PLUGIN_OIDC_SERVICE_USER_CLIENT_ID=mifos
      # FINERACT_PLUGIN_OIDC_SERVICE_USER_CLIENT_SECRET loaded from .env.docker
      - FINERACT_PLUGIN_OIDC_WEBAPP_CLIENT_ID=331500467848847765
      - FINERACT_PLUGIN_OIDC_OPAQUETOKEN_CLIENT_ID=331498876966109885
      # FINERACT_PLUGIN_OIDC_OPAQUETOKEN_CLIENT_SECRET loaded from .env.docker
      - FINERACT_PLUGIN_OIDC_CONCURRENT_SESSIONS=1
      - FINERACT_SERVER_OAUTH_RESOURCE_URL=https://mifos-security-plugin-oawujj.us1.zitadel.cloud
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
