name: e2e

# Runs the Playwright browser specs (`chromium`) and the factory specs
# (`integration`) against a real Fineract started from
# docker-compose.e2e.yml. The browser-free `unit` project already runs in
# build-run.yml.
on:
  pull_request:
    branches:
      - dev
      - main
  # So another workflow can require a passing run, e.g. before publishing.
  workflow_call:
  workflow_dispatch:

concurrency:
  # github.ref is refs/pull/<number>/merge on a pull request, so two PRs
  # from same-named branches in different forks do not cancel each other.
  group: e2e-${{ github.ref }}
  # A new push to a PR replaces its previous run. Other runs are kept.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The job name is what branch rules match on. Changing it turns its required
# check into a check that never reports.
jobs:
  e2e:
    name: Playwright E2E
    # Not ubuntu-latest: Playwright installs browsers only on the Ubuntu
    # releases its version supports, and 1.58 predates the one ubuntu-latest
    # now points to. Move this on when Playwright is upgraded.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      CI: true
      E2E_FINERACT_URL: https://localhost:3000
      E2E_BASE_URL: http://localhost:5173
      # dist/ is built in its own step below, so webServer only serves it.
      E2E_PREBUILT: 1
      # No NODE_TLS_REJECT_UNAUTHORIZED: everything that calls Fineract
      # already accepts its self-signed certificate (`ignoreHTTPSErrors` in
      # the fixtures and readiness probe, `secure: false` in the Vite
      # proxy), and the variable would also turn off certificate checks for
      # `npm ci` and the browser download.
      # The json reporter in `test:e2e:ci` writes here, inside the uploaded
      # report. That holds while `json` is listed after `html`, because the
      # html reporter clears its folder when it finishes.
      PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report/results.json

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Started first so Fineract boots while the steps below run. This
      # returns without waiting; `Wait for Fineract` waits for it.
      - name: Start Fineract and PostgreSQL
        run: docker compose -f docker-compose.e2e.yml up -d

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # openapi-generator-cli, run by `npm run build`, needs Java.
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build project
        run: npm run build

      # Blocks until the compose healthchecks pass. Fineract's first boot
      # runs its database migrations and can take several minutes, more
      # than the ~90s the readiness probe in playwright/global-setup.ts
      # allows.
      - name: Wait for Fineract
        run: docker compose -f docker-compose.e2e.yml up -d --wait --wait-timeout 600

      - name: Run Playwright tests
        run: npm run test:e2e:ci

      - name: Dump Docker logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.e2e.yml ps -a || true
          docker compose -f docker-compose.e2e.yml logs --no-color --tail 200 fineract || true
          docker compose -f docker-compose.e2e.yml logs --no-color --tail 50 db || true
          docker stats --no-stream || true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Fineract and PostgreSQL
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans
