# =============================================================================
# Publish Mifos X React Web App to Docker Hub
# =============================================================================
# Triggers on:
#   - Push to 'dev' branch  → tags: dev, <short-sha>, <long-sha>
#   - Semver tag push (v*.*.*)  → tags: <version>, latest
#
# Secrets required in the repository:
#   DOCKER_USER  – Docker Hub username
#   DOCKER_PASSWORD     – Docker Hub access token
# =============================================================================

name: Publish to Docker Hub

on:
  push:
    branches:
      - dev
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ──────────────────────────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ── Metadata (tags & labels) ─────────────────────────────────────
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: openmf/web-app-react
          tags: |
            # On dev branch: tag as "dev" + git sha
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=sha,prefix=,format=long
            # On version tag: tag as version + latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # ── Set up Docker Buildx (multi-platform support) ────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Authenticate with Docker Hub ─────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── Build & Push ─────────────────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
