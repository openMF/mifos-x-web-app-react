# =============================================================================
# Production Overrides for Mifos X Docker Deployment
# =============================================================================
#
# Usage:
#   docker compose -f docker-compose-zitadel.yml -f docker-compose.prod.yml up -d
#
# This file layers on top of docker-compose-zitadel.yml with:
#   - Pinned image versions (no :develop or :latest)
#   - Read-only root filesystems
#   - Tighter resource limits
#   - HSTS enabled
#   - TLS required on both database connections (sslmode=verify-full)
#   - No exposed DB/backend ports (only web-app)
# =============================================================================

services:
  web-app:
    image: mifos/web-app-react:${VERSION:-1.0.0}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
      - /tmp/nginx:uid=101,gid=101
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M

  fineractpostgres:
    restart: unless-stopped
    # TLS is required in production. Supply the certificates yourself and point
    # POSTGRES_TLS_DIR at the directory holding them. server.crt must be issued
    # by ca.crt and carry a subject alternative name of "fineractpostgres",
    # otherwise the sslmode=verify-full connections below will be rejected.
    # server.key must be owned by uid 999 (the postgres user) with mode 0600.
    # See fineract-db/tls/pg_hba.conf.sample for an hba file that refuses any
    # non-TLS connection.
    volumes:
      - ${POSTGRES_TLS_DIR:-./certs/postgres}:/etc/postgres-tls:ro
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgres-tls/server.crt
      - -c
      - ssl_key_file=/etc/postgres-tls/server.key
      - -c
      - ssl_ca_file=/etc/postgres-tls/ca.crt
      - -c
      - hba_file=/etc/postgres-tls/pg_hba.conf
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M

  fineract-server:
    # Pin to a specific release for production
    # image: openmf/fineract:1.9.0
    restart: unless-stopped
    ports: [] # Don't expose Fineract directly in production
    # The CA that issued the PostgreSQL server certificate, so Fineract can
    # verify the database it connects to.
    volumes:
      - ${FINERACT_TLS_DIR:-./certs/fineract}:/etc/fineract-tls:ro
    environment:
      - FINERACT_SECURITY_HSTS_ENABLED=true
      # Encrypt and authenticate both database connections.
      - 'FINERACT_HIKARI_JDBC_URL=jdbc:postgresql://fineractpostgres:5432/fineract_tenants?sslmode=verify-full&sslrootcert=/etc/fineract-tls/ca.crt'
      - 'FINERACT_DEFAULT_TENANTDB_CONN_PARAMS=sslmode=verify-full&sslrootcert=/etc/fineract-tls/ca.crt'
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
